<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c0a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маленькі кроки">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Маленькі кроки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: bento grid of soft rounded cards under a sticky header (Today / Goals / Habits / Reports),
   bottom tab bar on phones. Palette: sage and deep forest on soft cream (light) or near-black (dark).
   Type: Manrope, heavy weights for numbers. */
:root{
  --bg:#f3f2ea; --surface:#fdfdf9; --surface2:#eceee1; --ink:#18261c; --muted:#66756a; --line:#e1e4d4;
  --accent:#6f9a4b; --accent-soft:#dfe9cf; --accent-text:#3d6a24; --on-accent:#ffffff;
  --deep:#1e3a2a; --deep-ink:#f1f5ea; --deep-muted:#a9bba6; --flame:#a9d36a; --danger:#b5543f;
  --shadow:0 1px 2px rgba(30,58,42,.05),0 8px 24px rgba(30,58,42,.07);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c0a; --surface:#141a15; --surface2:#1c241d; --ink:#eaf0e6; --muted:#8c9b8f; --line:#26302a;
    --accent:#8dba62; --accent-soft:#213322; --accent-text:#a8d27c; --on-accent:#0c150c;
    --deep:#1d3a2a; --deep-ink:#eef4e8; --deep-muted:#9db39b; --flame:#b6e070; --danger:#e0806a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c0a; --surface:#141a15; --surface2:#1c241d; --ink:#eaf0e6; --muted:#8c9b8f; --line:#26302a;
  --accent:#8dba62; --accent-soft:#213322; --accent-text:#a8d27c; --on-accent:#0c150c;
  --deep:#1d3a2a; --deep-ink:#eef4e8; --deep-muted:#9db39b; --flame:#b6e070; --danger:#e0806a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-bottom:40px}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent-text)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);margin-inline:auto}
.tab{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--deep);color:var(--deep-ink)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;padding:3px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
.seg button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--deep);color:var(--deep-ink)}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding:0 6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sync.saving::before{background:#d2a94a}.sync.local::before,.sync.slow::before{background:var(--muted)}.sync.error::before{background:var(--danger)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:920px){.c4{grid-column:span 6}.c5,.c7,.c8{grid-column:span 12}.hero{grid-column:span 12}}
@media (max-width:620px){.c4,.c6{grid-column:span 12}.card{padding:18px;border-radius:22px}}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.hero{background:linear-gradient(160deg,var(--accent-soft),var(--surface2));position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:230px}
.hero h1{font-size:clamp(27px,4vw,34px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--accent-text);display:block}
.hero p{max-width:30ch;color:var(--muted)}
.hero .deco{position:absolute;right:-18px;bottom:-26px;width:150px;height:150px;color:var(--accent);opacity:.28;pointer-events:none}
.hi{font-size:13px;font-weight:700;color:var(--accent-text)}

.ringcard{display:flex;flex-direction:column;gap:16px}
.ringrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-size:30px;line-height:1}
.ring .mid small{font-size:12px;font-weight:700;color:var(--accent-text)}
.legend{display:grid;gap:10px}
.legend div{display:flex;align-items:baseline;gap:8px}
.legend b{font-size:22px}
.quote{background:var(--surface2);border-radius:18px;padding:14px 16px;font-weight:700;font-size:14px}

.streak{background:var(--deep);color:var(--deep-ink);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.streak h2{color:var(--deep-ink);font-size:15px}
.flamebig{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--flame);margin-top:6px}
.streak .big{font-size:52px;line-height:1}
.streak .u{color:var(--deep-muted);font-size:14px;font-weight:600}
.streak .keep{color:var(--flame);font-weight:700;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;margin-top:10px}
.week div{display:grid;justify-items:center;gap:5px;font-size:11.5px;color:var(--deep-muted);font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;color:var(--deep)}
.dot.on{background:var(--flame);border-color:var(--flame)}
.dot.now{border-color:var(--flame)}

.datebar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.datebar .dl{font-weight:800;font-size:18px;text-transform:capitalize;letter-spacing:-.01em}
.datebar .icon-btn[disabled]{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;background:var(--deep);color:var(--deep-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-text);border-radius:18px;padding:12px 16px;margin-bottom:16px;font-weight:600;font-size:14px}

.group{display:grid;gap:4px}
.group + .group{margin-top:14px}
.ghead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.group .row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row.ok .t{color:var(--accent-text)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.step button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.step span{min-width:44px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.step span.ok{color:var(--accent-text)}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chip{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.fl{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}
.fl.off{color:var(--muted)}
.empty{padding:26px 8px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.iconbtn2{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn2:hover{background:var(--surface2);color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}

.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.sechead h1{font-size:24px;font-weight:800;letter-spacing:-.02em}

/* habits page */
.hcard{display:grid;gap:14px;align-content:start}
.hhead{display:flex;align-items:center;gap:12px}
.hhead .grow{flex:1;min-width:0}
.hhead .t{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.flamerow{display:flex;align-items:center;gap:14px}
.flamerow .flamebig{margin:0;width:64px;height:64px;background:var(--deep);color:var(--flame)}
.flamerow .num{font-size:40px;line-height:1}
.flamerow .num.off{color:var(--muted)}
.flamerow .num.off + .u{color:var(--muted)}
.flamerow .u{font-weight:700;color:var(--accent-text)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk7 button{display:grid;justify-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.wk7 .dot2{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.wk7 .on .dot2{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted)}
.kv b{color:var(--ink)}

/* reports */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:18px}
.tile .num{font-size:32px;line-height:1.1;display:block}
.tile .small{display:block;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:var(--h,64px)}
.bars i{flex:1;min-width:2px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars i.z{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:end;padding:14px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
@media (max-width:620px){.rrow{grid-template-columns:1fr}}
.rrow .t{font-weight:700}
.rrow .s{font-size:13px;color:var(--muted)}
.ranges{display:inline-flex;padding:3px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
.ranges button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted)}
.ranges button.on{background:var(--deep);color:var(--deep-ink)}
.mo{background:var(--deep);color:var(--deep-ink)}
.mo h2{color:var(--deep-ink)}
.mocols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:end;height:170px;margin-top:6px}
.mocol{display:grid;gap:6px;justify-items:center;height:100%;align-content:end}
.mocol .tr{width:100%;max-width:46px;height:120px;display:flex;align-items:flex-end}
.mocol .tr i{display:block;width:100%;background:var(--deep-muted);border-radius:10px 10px 0 0;opacity:.55;min-height:3px}
.mocol.best .tr i{background:var(--flame);opacity:1}
.mocol .p{font-size:12px;font-weight:800;color:var(--deep-muted);font-variant-numeric:tabular-nums}
.mocol.best .p{color:var(--flame)}
.mocol .w{font-size:11.5px;color:var(--deep-muted);font-weight:600}
.bestw{display:flex;align-items:center;gap:12px;margin-top:14px;background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.bestw .grow{flex:1}

/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,12,9,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:24px;width:min(460px,100%);display:grid;gap:16px;max-height:100%;overflow:auto}
.modal h2{font-size:20px}
.fld{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time]{width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px}
.fld input:focus{outline:2px solid var(--accent);border-color:transparent}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opts span{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:14px}
.opts input:checked + span{background:var(--deep);color:var(--deep-ink)}
.opts input:focus-visible + span{outline:2px solid var(--accent-text);outline-offset:2px}
.opts.icons span{width:42px;height:42px;padding:0;justify-content:center;border-radius:12px}
.since,.mlab,.wlab{display:none}
.modal:has(input[name=kind][value=quit]:checked) .since{display:grid}
.modal:has(input[name=type][value=monthly]:checked) .mlab{display:inline}
.modal:has(input[name=type][value=weekly]:checked) .wlab{display:inline}
.modal:has(input[name=type][value=weekly]:checked) .dlab{display:none}
.modal:has(input[name=type][value=monthly]:checked) .dlab{display:none}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.actions .sp{margin-right:auto}

/* phones: bottom tab bar */
@media (max-width:760px){
  .top{gap:10px}
  .sync{font-size:0;gap:0}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:22px 22px 0 0;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));justify-content:space-around;z-index:50;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
  .tab{flex-direction:column;gap:3px;padding:8px 10px;font-size:11.5px;border-radius:16px;flex:1;align-items:center}
  .wrap{padding-bottom:104px}
}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time]{font-size:16px}
@media (max-width:620px){
  .top{padding:10px 0}
  .hero{min-height:0;gap:12px}
  .hero .deco{width:110px;height:110px}
  .ring{width:116px;height:116px}
  .ring .mid b{font-size:26px}
  .chk{width:36px;height:36px}
  .step button{width:36px;height:36px}
  .step span{min-width:38px}
  .icon-btn{width:40px;height:40px}
  .iconbtn2{width:40px;height:40px}
  .btn.sm{padding:9px 14px}
  .wk7 .dot2{width:30px;height:30px}
  .sechead h1{font-size:22px}
  .datebar .dl{font-size:16px}
  .mocols{gap:6px}
  .ov{align-items:end;justify-items:stretch;padding:0}
  .modal{width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%}
  .actions .btn{flex:1;justify-content:center}
}
@media (max-width:480px){.brand span:last-child{display:none}}
@media (max-width:380px){.seg button{padding:6px 8px}.sync{display:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pday{display:grid;gap:8px;align-content:start;padding:18px}
.pday.today{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.pdh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pdh b{text-transform:capitalize;font-size:16px}
.uni{display:flex;align-items:center;gap:8px;background:var(--surface2);color:var(--muted);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700}
.prow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prow .chk{width:26px;height:26px;margin-top:1px}
.prow .t{font-weight:700;overflow-wrap:anywhere;font-size:14px}
.prow.dn .t{text-decoration:line-through;color:var(--muted)}
.prow .s{font-size:12px;color:var(--muted)}
.pweek{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pweek .dl{font-weight:800;font-size:17px;letter-spacing:-.01em}
@media (max-width:620px){.prow .chk{width:32px;height:32px}.pgrid{grid-template-columns:minmax(0,1fr)}}
.sync.signin{display:inline-flex!important;font-size:13px!important;gap:6px!important;background:var(--deep);color:var(--deep-ink);padding:8px 14px;border-radius:999px;font-weight:700}
.sync.signin::before{background:var(--flame)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* ВСТАВ СВІЙ КОНФІГ FIREBASE: Project settings -> Your apps -> Web app -> firebaseConfig.
   Заміни рядки з PASTE на свої значення. Поки там PASTE, сайт працює без синхронізації. */
window.FIREBASE_CONFIG={
  apiKey:"PASTE_API_KEY",
  authDomain:"PASTE_PROJECT_ID.firebaseapp.com",
  projectId:"PASTE_PROJECT_ID",

function dayPct(d){var a=dayItems(d);return a.length?a.filter(Boolean).length/a.length:null}
function hasAct(d){
  for(var i=0;i<S.goals.length;i++)for(var j=0;j<S.goals[i].tasks.length;j++)if((S.goals[i].tasks[j].log[d]||0)>0)return true;
  for(var h=0;h<S.habits.length;h++)if(S.habits[h].kind==='build'&&S.habits[h].done[d])return true;
  return false;
}
function actStreak(){var td=TD(),d=hasAct(td)?td:addDays(td,-1),n=0;while(hasAct(d)&&n<4000){n++;d=addDays(d,-1)}return n}
function habitStreak(h){var td=TD(),d=h.done[td]?td:addDays(td,-1),n=0;while(h.done[d]&&n<4000){n++;d=addDays(d,-1)}return n}
function bestRun(h){var ks=Object.keys(h.done).sort(),best=0,run=0,prev=null;ks.forEach(function(k){run=(prev&&diffDays(prev,k)===1)?run+1:1;prev=k;if(run>best)best=run});return best}
function quitDays(h){return Math.max(0,diffDays(h.since,TD()))}
function quitBest(h){return Math.max(h.best||0,quitDays(h))}
var MARKS=[1,3,7,14,30,60,90,180,365,730,1095];
function nextMark(n){for(var i=0;i<MARKS.length;i++)if(MARKS[i]>n)return MARKS[i];return n+365}
function findGoal(id){return S.goals.filter(function(g){return g.id===id})[0]}
function findTask(g,id){return g.tasks.filter(function(k){return k.id===id})[0]}
function findHabit(id){return S.habits.filter(function(h){return h.id===id})[0]}
function unitTxt(k){return k.unit?' '+esc(k.unit):''}
function taskTag(k){return k.target+unitTxt(k)+' '+t(k.type==='daily'?'per_day':k.type==='weekly'?'per_week':'per_month')}
function typeLabel(k){return t(k.type==='daily'?'daily':k.type==='weekly'?'weekly':'monthly')}

var UNI={1:['11:40','14:35'],2:['10:05','16:10'],3:['11:40','16:10'],4:['11:40','16:10'],5:['10:05','13:00']};
var PW=weekStart(TD());
function findPlan(id){return S.plan.filter(function(p){return p.id===id})[0]}
function catName(c){return t('c_'+(c==='interview'||c==='python'||c==='video'?c:'other'))}

/* ---------- views ---------- */
var TABICON={today:'cal',planner:'list',goals:'target',habits:'flame',reports:'chart'};

  if(sync==='signin')return '<button id="sync" class="sync signin" data-act="signin" title="'+esc(t('signin_t'))+'">'+t('s_signin')+'</button>';
  return '<span id="sync" class="sync '+sync+'" title="'+t('s_'+sync)+'">'+t('s_'+sync)+'</span>'+(FB&&FB.user?'<button class="icon-btn" data-act="signout" aria-label="'+t('signout')+'" title="'+t('signout')+'">'+svg('logout',18)+'</button>':'');
}
function header(){
  var tabs=['today','planner','goals','habits','reports'].map(function(k){return '<button class="tab '+(tab===k?'on':'')+'" data-act="nav" data-k="'+k+'" '+(tab===k?'aria-current="page"':'')+'>'+svg(TABICON[k],18)+'<span>'+t('nav_'+k)+'</span></button>'}).join('');
  return '<header class="top"><div class="brand"><span class="logo">'+svg('leaf',20)+'</span><span>'+t('app')+'</span></div>'+
    '<nav class="tabs">'+tabs+'</nav>'+
    '<div class="tools">'+syncEl()+
    '<div class="seg" role="group"><button class="'+(S.lang==='uk'?'on':'')+'" data-act="lang" data-k="uk">UA</button><button class="'+(S.lang==='en'?'on':'')+'" data-act="lang" data-k="en">EN</button></div>'+
    '<button class="icon-btn" data-act="theme" aria-label="'+t('theme')+'">'+svg(isDark()?'sun':'moon',18)+'</button></div></header>';

function banner(){
  var has=S.goals.some(function(g){return g.ex})||S.habits.some(function(h){return h.ex});
  return has?'<div class="banner"><span>'+t('ex_note')+'</span><button class="btn soft sm" data-act="rm-ex">'+t('ex_rm')+'</button></div>':'';
}
function stepper(g,k,v,okc){
  return '<div class="step"><button data-act="task-add" data-g="'+g.id+'" data-t="'+k.id+'" data-n="-1" aria-label="−1">'+svg('minus',14)+'</button><span class="'+(okc?'ok':'')+'">'+(k.type==='daily'?v+'/'+k.target:v)+'</span><button data-act="task-add" data-g="'+g.id+'" data-t="'+k.id+'" data-n="1" aria-label="+1">'+svg('plus',14)+'</button></div>';
}
function todayTaskRow(g,k,d){
  var v=k.log[d]||0,ctrl,sub,ok=false;
  if(k.type==='daily'){
    ok=v>=k.target;sub=taskTag(k);
    ctrl=k.target===1?'<button class="chk '+(ok?'on':'')+'" data-act="task-set" data-g="'+g.id+'" data-t="'+k.id+'" data-v="'+(ok?0:1)+'" aria-label="'+esc(k.title)+'">'+svg('check',16)+'</button>':stepper(g,k,v,ok);
  }else{
    var ms=periodSum(k,d);ok=ms>=k.target;
    sub=t(k.type==='weekly'?'week_prog':'month_prog',{a:ms,b:k.target})+unitTxt(k);
    ctrl=stepper(g,k,v,false);
  }
  var bar=k.type!=='daily'?'<div class="bar"><i style="width:'+Math.min(100,periodSum(k,d)/k.target*100)+'%"></i></div>':'';
  return '<div class="row '+(ok?'ok':'')+'"><div class="grow"><div class="t">'+esc(k.title)+'</div><div class="s">'+sub+'</div>'+bar+'</div>'+ctrl+'</div>';
}
function viewToday(){
  var td=TD(),d=VD,isT=d===td,items=dayItems(d),done=items.filter(Boolean).length,pct=items.length?done/items.length:0;
  var C=2*Math.PI*52,hr=new Date().getHours();
  var hi=hr>=5&&hr<12?'hi_m':hr>=12&&hr<18?'hi_d':hr>=18&&hr<23?'hi_e':'hi_n';
  var msg=!items.length?t('no_items'):pct>=.75?t('m_great'):pct>=.5?t('m_good'):pct>0?t('m_ok'):t('m_zero');
  var st=actStreak(),ws=weekStart(td);
  var wk='';for(var i=0;i<7;i++){var wd=addDays(ws,i),on=hasAct(wd);
    wk+='<div><span class="dot '+(on?'on':'')+' '+(wd===td&&!on?'now':'')+'">'+(on?svg('check',12):'')+'</span>'+fmt(wd,{weekday:'short'})+'</div>'}
  var line=T[S.lang].lines[new Date().getDate()%T[S.lang].lines.length];
  var bar='<div class="datebar"><button class="icon-btn" data-act="day" data-n="-1" aria-label="'+t('prev_day')+'">'+svg('left',18)+'</button>'+
    '<span class="dl">'+fmt(d,{weekday:'long',day:'numeric',month:'long'})+'</span>'+
    '<button class="icon-btn" data-act="day" data-n="1" '+(isT?'disabled':'')+' aria-label="'+t('next_day')+'">'+svg('right',18)+'</button>'+
    (isT?'':'<button class="btn soft sm" data-act="day" data-n="0">'+t('back_today')+'</button>')+'</div>';
  var hero='<section class="card hero c4"><div><div class="hi">'+t(hi)+'</div><h1>'+t('hero1')+'<span>'+t('hero2')+'</span></h1></div><p>'+t('hero_p')+'</p><div class="deco">'+svg('leaf',150)+'</div></section>';
  var ring='<section class="card ringcard c4"><div class="card-h" style="margin:0"><h2>'+t('day_progress')+'</h2></div><div class="ringrow"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="52" fill="none" stroke="var(--accent-soft)" stroke-width="12"/><circle cx="66" cy="66" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"/></svg><div class="mid"><b class="num">'+Math.round(pct*100)+'%</b><small>'+(items.length?msg:'')+'</small></div></div>'+
    '<div class="legend"><div><b class="num">'+done+'</b><span class="muted small">'+t('done')+'</span></div><div><b class="num">'+(items.length-done)+'</b><span class="muted small">'+t('left')+'</span></div></div></div>'+
    (items.length?'':'<div class="muted small">'+msg+'</div>')+'<div class="quote">'+esc(line)+'</div></section>';
  var streak='<section class="card streak c4"><h2>'+t('streak_t')+'</h2><div class="flamebig">'+svg('flame',44,true)+'</div><div class="num big">'+st+'</div><div class="u">'+pl(st,S.lang==='uk'?['день','дні','днів']:['day','days'])+' '+t('row_days')+'</div><div class="keep">'+(st?t('keep'):t('first_step'))+'</div><div class="week">'+wk+'</div></section>';
  var tasks='';
  S.goals.forEach(function(g){
    if(!g.tasks.length)return;
    tasks+='<div class="group"><div class="ghead">'+svg(g.icon,16)+esc(g.title)+'</div>'+g.tasks.map(function(k){return todayTaskRow(g,k,d)}).join('')+'</div>';
  });
  if(!tasks)tasks='<div class="empty"><p>'+t('no_tasks')+'</p><button class="btn" data-act="new-goal">'+svg('plus',16)+t('new_goal')+'</button></div>';
  var hb='';
  S.habits.forEach(function(h){
    if(h.kind==='build'){
      var on=!!h.done[d],s=habitStreak(h);
      hb+='<div class="row '+(on?'ok':'')+'"><span class="chip">'+svg(h.icon,18)+'</span><div class="grow"><div class="t">'+esc(h.title)+'</div><div class="s"><span class="fl '+(s?'':'off')+'">'+svg('flame',14,s>0)+s+'</span> '+t('row_days')+'</div></div><button class="chk '+(on?'on':'')+'" data-act="habit-toggle" data-h="'+h.id+'" data-d="'+d+'" aria-label="'+esc(h.title)+'">'+svg('check',16)+'</button></div>';
    }else{
      var n=Math.max(0,diffDays(h.since,d));
      hb+='<div class="row"><span class="chip">'+svg(h.icon,18)+'</span><div class="grow"><div class="t">'+esc(h.title)+'</div><div class="s">'+t('clean')+'</div></div><span class="fl">'+svg('flame',16,true)+daysTxt(n)+'</span></div>';
    }
  });
  if(!hb)hb='<div class="empty"><p>'+t('no_habits')+'</p><button class="btn" data-act="new-habit">'+svg('plus',16)+t('new_habit')+'</button></div>';
  return bar+'<div class="grid">'+hero+ring+streak+
    '<section class="card c7"><div class="card-h"><h2>'+t('tasks_day')+'</h2><button class="btn soft sm" data-act="new-goal">'+svg('plus',14)+t('new_goal')+'</button></div>'+tasks+'</section>'+
    '<section class="card c5"><div class="card-h"><h2>'+t('habits_day')+'</h2><button class="btn soft sm" data-act="new-habit">'+svg('plus',14)+t('new_habit')+'</button></div>'+hb+'</section></div>';
}

function viewGoals(){
  var td=TD(),cards=S.goals.map(function(g){
    var ratios=g.tasks.map(function(k){return k.type==='daily'?Math.min(1,(k.log[td]||0)/k.target):Math.min(1,periodSum(k,td)/k.target)});
    var avg=ratios.length?Math.round(ratios.reduce(function(a,b){return a+b},0)/ratios.length*100):0;
    var dl=g.tasks.filter(function(k){return k.type==='daily'});
    var rows=g.tasks.map(function(k){
      var v=k.type==='daily'?(k.log[td]||0):periodSum(k,td),p=Math.min(100,v/k.target*100);
      return '<div class="row"><div class="grow"><div class="t">'+esc(k.title)+'</div><div class="s"><span class="tag">'+typeLabel(k)+'</span> '+taskTag(k)+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>'+
        '<div class="num small">'+v+'/'+k.target+'</div><button class="iconbtn2" data-act="edit-task" data-g="'+g.id+'" data-t="'+k.id+'" aria-label="'+t('edit')+'">'+svg('pencil',16)+'</button></div>';
    }).join('')||'<div class="muted small" style="padding:8px 0">'+t('no_goal_tasks')+'</div>';
    return '<section class="card c6"><div class="hhead" style="margin-bottom:8px"><span class="chip">'+svg(g.icon,20)+'</span><div class="grow"><div class="t">'+esc(g.title)+'</div><div class="s muted small">'+(dl.length?t('tasks_done_today',{a:dl.filter(function(k){return taskOk(k,td)}).length,b:dl.length}):'')+'</div></div><span class="pill">'+avg+'%</span><button class="iconbtn2" data-act="edit-goal" data-g="'+g.id+'" aria-label="'+t('edit')+'">'+svg('pencil',16)+'</button></div>'+
      '<div class="group">'+rows+'</div><div style="margin-top:12px"><button class="btn soft sm" data-act="new-task" data-g="'+g.id+'">'+svg('plus',14)+t('add_task')+'</button></div></section>';
  }).join('');
  if(!cards)cards='<section class="card c12"><div class="empty"><p>'+t('no_goals')+'</p></div></section>';
  return '<div class="sechead"><h1>'+t('goals')+'</h1><button class="btn" data-act="new-goal">'+svg('plus',16)+t('new_goal')+'</button></div><div class="grid">'+cards+'</div>';
}

function viewHabits(){
  var td=TD(),cards=S.habits.map(function(h){
    var head='<div class="hhead"><span class="chip">'+svg(h.icon,20)+'</span><div class="grow"><div class="t">'+esc(h.title)+'</div><div class="muted small">'+(h.kind==='build'?t('build'):t('quit'))+'</div></div><button class="iconbtn2" data-act="edit-habit" data-h="'+h.id+'" aria-label="'+t('edit')+'">'+svg('pencil',16)+'</button></div>';
    if(h.kind==='build'){
      var s=habitStreak(h),dots='';
      for(var i=6;i>=0;i--){var d=addDays(td,-i),on=!!h.done[d];
        dots+='<button class="'+(on?'on':'')+'" data-act="habit-toggle" data-h="'+h.id+'" data-d="'+d+'" aria-label="'+fmt(d,{day:'numeric',month:'long'})+'"><span class="dot2">'+svg('check',14)+'</span>'+fmt(d,{weekday:'narrow'})+'</button>'}
      return '<section class="card hcard c4">'+head+'<div class="flamerow"><div class="flamebig">'+svg('flame',32,true)+'</div><div><div class="num '+(s?'':'off')+'">'+s+'</div><div class="u">'+pl(s,S.lang==='uk'?['день','дні','днів']:['day','days'])+' '+t('row_days')+'</div></div></div>'+
        '<div class="wk7">'+dots+'</div><div class="kv"><span>'+t('best')+'</span><b>'+daysTxt(Math.max(bestRun(h),s))+'</b></div>'+
        '<button class="btn '+(h.done[td]?'soft':'')+'" data-act="habit-toggle" data-h="'+h.id+'" data-d="'+td+'" style="justify-content:center">'+svg('check',16)+(h.done[td]?t('checked'):t('checkin'))+'</button></section>';
    }
    var n=quitDays(h),nm=nextMark(n),prev=0;MARKS.forEach(function(m){if(m<=n)prev=m});
    var prog=Math.min(100,(n-prev)/(nm-prev)*100);
    var ask=UI.relapse===h.id;
    return '<section class="card hcard c4">'+head+'<div class="flamerow"><div class="flamebig">'+svg('flame',32,true)+'</div><div><div class="num">'+n+'</div><div class="u">'+pl(n,S.lang==='uk'?['день','дні','днів']:['day','days'])+' '+t('clean')+'</div></div></div>'+
      '<div><div class="kv"><span>'+t('next_mark')+'</span><b>'+daysTxt(nm)+'</b></div><div class="bar"><i style="width:'+prog+'%"></i></div></div>'+
      '<div class="kv"><span>'+t('since',{d:fmt(h.since,{day:'numeric',month:'long',year:'numeric'})})+'</span><b>'+t('best')+': '+daysTxt(quitBest(h))+'</b></div>'+
      '<div class="kv"><span>'+t('slips')+'</span><b>'+h.relapses.length+'</b></div>'+
      (ask?'<div class="actions"><span class="sp small muted" style="align-self:center">'+t('slip_q')+'</span><button class="btn ghost sm" data-act="relapse-cancel">'+t('cancel')+'</button><button class="btn danger sm" data-act="relapse-do" data-h="'+h.id+'">'+t('slip_ok')+'</button></div>':
        '<button class="btn ghost" data-act="relapse-ask" data-h="'+h.id+'" style="justify-content:center">'+t('slip')+'</button>')+'</section>';
  }).join('');
  if(!cards)cards='<section class="card c12"><div class="empty"><p>'+t('no_habits')+'</p></div></section>';
  return '<div class="sechead"><h1>'+t('habits')+'</h1><button class="btn" data-act="new-habit">'+svg('plus',16)+t('new_habit')+'</button></div><div class="grid">'+cards+'</div>';
}

function rangeDays(){
  var td=TD(),n;
  if(RG==='m'){var f=td.slice(0,8)+'01';n=diffDays(f,td)+1;return Array.from({length:n},function(_,i){return addDays(f,i)})}
  n=+RG;return Array.from({length:n},function(_,i){return addDays(td,i-n+1)});
}
function bars(vals,h){
  var mx=Math.max.apply(null,vals.concat([1]));
  return '<div class="bars" style="--h:'+(h||64)+'px">'+vals.map(function(v){return '<i class="'+(v?'':'z')+'" style="height:'+(v?Math.max(6,v/mx*100):3)+'%" title="'+v+'"></i>'}).join('')+'</div>';
}
function viewReports(){
  var td=TD(),days=rangeDays(),N=days.length;
  if(!S.goals.length&&!S.habits.length)return '<div class="sechead"><h1>'+t('rep')+'</h1></div><section class="card"><div class="empty"><p>'+t('no_data')+'</p></div></section>';
  var actions=0,active=0,pcts=[];
  days.forEach(function(d){
    S.goals.forEach(function(g){g.tasks.forEach(function(k){actions+=k.log[d]||0})});
    S.habits.forEach(function(h){if(h.kind==='build'&&h.done[d])actions++});
    if(hasAct(d))active++;
    var p=dayPct(d);if(p!==null)pcts.push(p);
  });
  var rate=pcts.length?Math.round(pcts.reduce(function(a,b){return a+b},0)/pcts.length*100):0;
  var bs=0;S.habits.forEach(function(h){bs=Math.max(bs,h.kind==='build'?habitStreak(h):quitDays(h))});
  var tiles='<div class="tiles">'+[[actions,t('t_actions')],[active+'/'+N,t('t_active')],[daysTxt(bs),t('t_streak')],[rate+'%',t('t_rate')]].map(function(x){return '<div class="card tile"><span class="num">'+x[0]+'</span><span class="muted small">'+x[1]+'</span></div>'}).join('')+'</div>';
  var axis='<div class="axis"><span>'+fmt(days[0],{day:'numeric',month:'short'})+'</span><span>'+fmt(days[N-1],{day:'numeric',month:'short'})+'</span></div>';
  var goals=S.goals.map(function(g){
    var ga=days.filter(function(d){return g.tasks.some(function(k){return (k.log[d]||0)>0})}).length;
    var rows=g.tasks.map(function(k){
      var vals=days.map(function(d){return k.log[d]||0}),tot=vals.reduce(function(a,b){return a+b},0),sub;
      if(k.type==='daily'){var met=days.filter(function(d){return d>=k.created&&taskOk(k,d)}).length;sub=t('met_days',{a:met,b:N})}
      else sub=t(k.type==='weekly'?'week_prog':'month_prog',{a:periodSum(k,td),b:k.target});
      return '<div class="rrow"><div><div class="t">'+esc(k.title)+'</div><div class="s">'+t('goal_total')+': <b class="num" style="color:var(--ink)">'+tot+'</b>'+unitTxt(k)+'</div><div class="s">'+sub+'</div></div><div>'+bars(vals,56)+axis+'</div></div>';
    }).join('');
    return '<section class="card c12"><div class="hhead" style="margin-bottom:6px"><span class="chip">'+svg(g.icon,20)+'</span><div class="grow"><div class="t">'+esc(g.title)+'</div><div class="muted small">'+t('active_of',{a:ga,b:N})+'</div></div></div>'+rows+'</section>';
  }).join('');
  /* monthly overview */
  var f=td.slice(0,8)+'01',last=ymd(new Date(parse(td).getFullYear(),parse(td).getMonth()+1,0)),wks=[],ws=weekStart(f);
  while(ws<=last){var ps=[];for(var i=0;i<7;i++){var d=addDays(ws,i);if(d>=f&&d<=td&&d<=last){var p=dayPct(d);if(p!==null)ps.push(p)}}
    wks.push(ps.length?ps.reduce(function(a,b){return a+b},0)/ps.length:null);ws=addDays(ws,7)}
  var bi=-1,bv=-1;wks.forEach(function(v,i){if(v!==null&&v>bv){bv=v;bi=i}});
  var mo='<section class="card mo c7"><div class="card-h"><h2>'+t('mo_over')+'</h2><span class="small" style="color:var(--deep-muted);text-transform:capitalize">'+fmt(td,{month:'long',year:'numeric'})+'</span></div><div class="mocols">'+
    wks.map(function(v,i){return '<div class="mocol '+(i===bi?'best':'')+'"><span class="p">'+(v===null?'–':Math.round(v*100)+'%')+'</span><div class="tr"><i style="height:'+(v===null?0:v*100)+'%"></i></div><span class="w">'+t('week',{n:i+1})+'</span></div>'}).join('')+'</div>'+
    (bi>=0?'<div class="bestw">'+svg('star',22,true)+'<div class="grow"><b>'+t('best_week')+'</b><div class="small" style="color:var(--deep-muted)">'+t('week',{n:bi+1})+'</div></div><div class="num" style="font-size:24px">'+Math.round(bv*100)+'%</div></div>':'')+'</section>';
  var hb=S.habits.map(function(h){
    if(h.kind==='build'){var c=days.filter(function(d){return h.done[d]}).length;
      return '<div class="row"><span class="chip">'+svg(h.icon,18)+'</span><div class="grow"><div class="t">'+esc(h.title)+'</div><div class="s">'+t('checks',{a:c,b:N})+'</div><div class="bar"><i style="width:'+(c/N*100)+'%"></i></div></div></div>'}
    var rl=h.relapses.filter(function(r){return r.date>=days[0]}).length;
    return '<div class="row"><span class="chip">'+svg(h.icon,18)+'</span><div class="grow"><div class="t">'+esc(h.title)+'</div><div class="s">'+daysTxt(quitDays(h))+' '+t('clean')+' · '+t('slips')+': '+rl+'</div></div></div>';
  }).join('');
  var hcard='<section class="card c5"><div class="card-h"><h2>'+t('rep_habits')+'</h2></div><div class="group">'+(hb||'<div class="muted small">'+t('no_habits')+'</div>')+'</div></section>';
  var rg=[['7',t('r7')],['30',t('r30')],['m',t('rm')]].map(function(x){return '<button class="'+(RG===x[0]?'on':'')+'" data-act="range" data-k="'+x[0]+'">'+x[1]+'</button>'}).join('');
  return '<div class="sechead"><h1>'+t('rep')+'</h1><div class="ranges">'+rg+'</div></div>'+tiles+'<div class="grid">'+mo+hcard+'<div class="c12 muted small ghead" style="margin-top:6px">'+t('by_goal')+'</div>'+goals+'</div>';
}

function viewPlanner(){
  var td=TD(),ws=PW,we=addDays(ws,6),mine=S.plan.filter(function(p){return p.date>=ws&&p.date<=we});
  var done=mine.filter(function(p){return p.done}).length,pct=mine.length?done/mine.length*100:0,cards='';
  for(var i=0;i<7;i++){
    var d=addDays(ws,i),list=S.plan.filter(function(p){return p.date===d}).sort(function(a,b){var x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:0});
    var u=UNI[parse(d).getDay()];
    var rows=list.map(function(p){
      return '<div class="prow '+(p.done?'dn':'')+'"><button class="chk '+(p.done?'on':'')+'" data-act="plan-toggle" data-p="'+p.id+'" aria-label="'+esc(p.title)+'">'+svg('check',14)+'</button><div class="grow" style="flex:1;min-width:0"><div class="t">'+esc(p.title)+'</div><div class="s">'+(p.time?esc(p.time)+' · ':'')+catName(p.cat)+'</div></div><button class="iconbtn2" data-act="edit-plan" data-p="'+p.id+'" aria-label="'+t('edit')+'">'+svg('pencil',15)+'</button></div>';
    }).join('');
    cards+='<section class="card pday '+(d===td?'today':'')+'"><div class="pdh"><div><b>'+fmt(d,{weekday:'long'})+'</b><div class="muted small">'+fmt(d,{day:'numeric',month:'long'})+'</div></div>'+(list.length?'<span class="pill">'+list.filter(function(p){return p.done}).length+'/'+list.length+'</span>':'')+'</div>'+
      (u?'<div class="uni">'+svg('book',15)+t('pl_uni')+' '+u[0]+'–'+u[1]+'</div>':'')+
      (rows||'<div class="muted small" style="padding:6px 0">'+t('pl_empty')+'</div>')+
      '<button class="btn soft sm" data-act="new-plan" data-d="'+d+'" style="justify-self:start">'+svg('plus',14)+t('pl_add')+'</button></section>';
  }
  var nav='<div class="pweek"><button class="icon-btn" data-act="plan-week" data-n="-1" aria-label="'+t('pl_prev')+'">'+svg('left',18)+'</button><span class="dl">'+fmt(ws,{day:'numeric',month:'short'})+' – '+fmt(we,{day:'numeric',month:'short'})+'</span><button class="icon-btn" data-act="plan-week" data-n="1" aria-label="'+t('pl_next')+'">'+svg('right',18)+'</button>'+(ws===weekStart(td)?'':'<button class="btn soft sm" data-act="plan-week" data-n="0">'+t('pl_this')+'</button>')+'</div>';
  return '<div class="sechead"><h1>'+t('planner')+'</h1><button class="btn" data-act="new-plan" data-d="'+(td>=ws&&td<=we?td:ws)+'">'+svg('plus',16)+t('new_plan')+'</button></div>'+
    '<section class="card" style="margin-bottom:16px;display:grid;gap:10px">'+nav+'<div class="kv"><span>'+(mine.length?t('pl_prog',{a:done,b:mine.length}):t('pl_none'))+'</span><b class="num">'+Math.round(pct)+'%</b></div><div class="bar" style="margin:0"><i style="width:'+pct+'%"></i></div></section>'+
    '<div class="pgrid">'+cards+'</div>';
}

function render(){
  var v=tab==='planner'?viewPlanner():tab==='goals'?viewGoals():tab==='habits'?viewHabits():tab==='reports'?viewReports():viewToday();
  $('#app').innerHTML=header()+'<main>'+banner()+v+'</main>';
}

/* ---------- modal ---------- */
function iconPicker(cur){return '<div class="fld"><span>'+t('f_icon')+'</span><div class="opts icons">'+PICK.map(function(n){return '<label><input type="radio" name="icon" value="'+n+'" '+(n===cur?'checked':'')+'><span>'+svg(n,20)+'</span></label>'}).join('')+'</div></div>'}
function radios(name,cur,list){return '<div class="opts">'+list.map(function(x){return '<label><input type="radio" name="'+name+'" value="'+x[0]+'" '+(x[0]===cur?'checked':'')+'><span>'+x[1]+'</span></label>'}).join('')+'</div>'}
function openModal(m){M=m;drawModal();setTimeout(function(){var i=$('#f-title');if(i)i.focus()},30)}
function closeModal(){M=null;$('#modal').innerHTML=''}
function drawModal(){
  if(!M){$('#modal').innerHTML='';return}
  var inner='',isEdit=!!M.id;
  if(M.type==='goal'){
    var g=isEdit?findGoal(M.id):null;
    inner='<h2>'+(g?t('e_goal'):t('new_goal'))+'</h2><label class="fld"><span>'+t('f_title')+'</span><input id="f-title" type="text" name="title" required maxlength="80" value="'+esc(g?g.title:'')+'" placeholder="'+esc(t('ph_goal'))+'"></label>'+iconPicker(g?g.icon:'target');
  }else if(M.type==='task'){
    var gg=findGoal(M.gid),k=isEdit&&gg?findTask(gg,M.id):null;
    inner='<h2>'+(k?t('e_task'):t('add_task'))+'</h2><label class="fld"><span>'+t('f_title')+'</span><input id="f-title" type="text" name="title" required maxlength="80" value="'+esc(k?k.title:'')+'" placeholder="'+esc(t('ph_task'))+'"></label>'+
      '<div class="fld"><span>'+t('f_type')+'</span>'+radios('type',k?k.type:'daily',[['daily',t('daily')],['weekly',t('weekly')],['monthly',t('monthly')]])+'</div>'+
      '<label class="fld"><span>'+t('f_target')+' <span class="dlab">('+t('per_day')+')</span><span class="wlab">('+t('per_week')+')</span><span class="mlab">('+t('per_month')+')</span></span><input type="number" name="target" min="1" max="9999" required value="'+(k?k.target:1)+'"></label>'+
      '<label class="fld"><span>'+t('f_unit')+'</span><input type="text" name="unit" maxlength="24" value="'+esc(k?k.unit||'':'')+'" placeholder="'+esc(t('ph_unit'))+'"></label>';
  }else if(M.type==='plan'){
    var pp=isEdit?findPlan(M.id):null;
    inner='<h2>'+(pp?t('e_plan'):t('new_plan'))+'</h2><label class="fld"><span>'+t('f_title')+'</span><input id="f-title" type="text" name="title" required maxlength="100" value="'+esc(pp?pp.title:'')+'" placeholder="'+esc(t('ph_plan'))+'"></label>'+
      '<label class="fld"><span>'+t('f_date')+'</span><input type="date" name="date" required value="'+(pp?pp.date:(M.date||TD()))+'"></label>'+
      '<label class="fld"><span>'+t('f_time')+'</span><input type="time" name="time" value="'+(pp?pp.time||'':'')+'"></label>'+
      '<div class="fld"><span>'+t('f_cat')+'</span>'+radios('cat',pp?pp.cat:'other',[['interview',t('c_interview')],['python',t('c_python')],['video',t('c_video')],['other',t('c_other')]])+'</div>';
  }else{
    var h=isEdit?findHabit(M.id):null,kind=h?h.kind:'build';
    inner='<h2>'+(h?t('e_habit'):t('new_habit'))+'</h2><label class="fld"><span>'+t('f_title')+'</span><input id="f-title" type="text" name="title" required maxlength="80" value="'+esc(h?h.title:'')+'" placeholder="'+esc(t('ph_habit'))+'"></label>'+
      (h?'<input type="hidden" name="kind" value="'+kind+'">':'<div class="fld"><span>'+t('f_kind')+'</span>'+radios('kind','build',[['build',t('build_l')],['quit',t('quit_l')]])+'</div>')+
      (h&&kind!=='quit'?'':'<label class="fld since"'+(h?' style="display:grid"':'')+'><span>'+t('f_since')+'</span><input type="date" name="since" max="'+TD()+'" value="'+(h&&h.since?h.since:TD())+'"></label>')+
      iconPicker(h?h.icon:'leaf');
  }
  var del=isEdit?'<button type="button" class="btn danger sp" data-act="del">'+(M.confirm?t('del_ok'):t('del'))+'</button>':'';
  $('#modal').innerHTML='<div class="ov"><form class="modal" data-form="'+M.type+'" role="dialog" aria-modal="true">'+inner+'<div class="actions">'+del+'<button type="button" class="btn ghost" data-act="close">'+t('cancel')+'</button><button type="submit" class="btn">'+t('save')+'</button></div></form></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var ov=e.target.classList&&e.target.classList.contains('ov');if(ov){closeModal();return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,ds=el.dataset,g,k,h;
  switch(a){
    case 'nav':tab=ds.k;try{location.hash=tab}catch(x){}render();window.scrollTo(0,0);break;
    case 'lang':S.lang=ds.k;applyTheme();save();break;
    case 'theme':S.theme=isDark()?'light':'dark';applyTheme();save();break;
    case 'day':{var n=+ds.n;VD=n===0?TD():addDays(VD,n);if(VD>TD())VD=TD();render();break}
    case 'range':RG=ds.k;render();break;
    case 'task-add':g=findGoal(ds.g);k=g&&findTask(g,ds.t);if(k){var v=Math.max(0,(k.log[VD]||0)+(+ds.n));if(v)k.log[VD]=v;else delete k.log[VD];save()}break;
    case 'task-set':g=findGoal(ds.g);k=g&&findTask(g,ds.t);if(k){if(+ds.v)k.log[VD]=k.target;else delete k.log[VD];save()}break;
    case 'habit-toggle':h=findHabit(ds.h);if(h){var dd=ds.d||VD;if(h.done[dd])delete h.done[dd];else h.done[dd]=1;save()}break;
    case 'relapse-ask':UI.relapse=ds.h;render();break;
    case 'relapse-cancel':UI.relapse=null;render();break;
    case 'relapse-do':h=findHabit(ds.h);if(h){var days=quitDays(h);h.relapses.push({date:TD(),days:days});h.best=Math.max(h.best||0,days);h.since=TD();UI.relapse=null;save()}break;
    case 'signin':if(FB){FB.auth.signInWithPopup(FB.provider).catch(function(e){var c=e&&e.code;if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment')return FB.auth.signInWithRedirect(FB.provider);if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')setSync('error')})}break;
    case 'signout':if(FB)FB.auth.signOut();break;
    case 'plan-toggle':{var pi=findPlan(ds.p);if(pi){pi.done=!pi.done;save()}break}
    case 'plan-week':{var nn=+ds.n;PW=nn===0?weekStart(TD()):addDays(PW,nn*7);render();break}
    case 'new-plan':openModal({type:'plan',date:ds.d});break;
    case 'edit-plan':openModal({type:'plan',id:ds.p});break;
    case 'new-goal':openModal({type:'goal'});break;
    case 'edit-goal':openModal({type:'goal',id:ds.g});break;
    case 'new-task':openModal({type:'task',gid:ds.g});break;
    case 'edit-task':openModal({type:'task',gid:ds.g,id:ds.t});break;
    case 'new-habit':openModal({type:'habit'});break;
    case 'edit-habit':openModal({type:'habit',id:ds.h});break;
    case 'close':closeModal();break;
    case 'del':
      if(!M)break;
      if(!M.confirm){M.confirm=true;drawModal();break}
      if(M.type==='goal')S.goals=S.goals.filter(function(x){return x.id!==M.id});
      else if(M.type==='task'){g=findGoal(M.gid);if(g)g.tasks=g.tasks.filter(function(x){return x.id!==M.id})}
      else if(M.type==='plan')S.plan=S.plan.filter(function(x){return x.id!==M.id});
      else S.habits=S.habits.filter(function(x){return x.id!==M.id});
      closeModal();save();break;
    case 'rm-ex':S.goals=S.goals.filter(function(x){return !x.ex});S.habits=S.habits.filter(function(x){return !x.ex});save();break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f||!M)return;e.preventDefault();
  var fd=new FormData(f),title=String(fd.get('title')||'').trim();if(!title)return;
  var icon=fd.get('icon');
  if(M.type==='goal'){
    if(M.id){var g=findGoal(M.id);if(g){g.title=title;g.icon=icon||g.icon}}
    else S.goals.push({id:uid(),title:title,icon:icon||'target',tasks:[]});
  }else if(M.type==='task'){
    var gg=findGoal(M.gid);if(!gg)return;
    var type=({monthly:1,weekly:1})[fd.get('type')]?fd.get('type'):'daily',target=Math.max(1,parseInt(fd.get('target'),10)||1),unit=String(fd.get('unit')||'').trim();
    if(M.id){var k=findTask(gg,M.id);if(k){k.title=title;k.type=type;k.target=target;k.unit=unit}}
    else gg.tasks.push({id:uid(),title:title,type:type,target:target,unit:unit,created:TD(),log:{}});
  }else if(M.type==='plan'){
    var pd=String(fd.get('date')||'');if(!pd)return;
    var pc=String(fd.get('cat')||'other'),pt=String(fd.get('time')||'');
    if(M.id){var pe=findPlan(M.id);if(pe){pe.title=title;pe.date=pd;pe.time=pt;pe.cat=pc}}
    else S.plan.push({id:uid(),date:pd,time:pt,cat:pc,title:title,done:false});
    PW=weekStart(pd);
  }else{
    var kind=fd.get('kind')==='quit'?'quit':'build',since=String(fd.get('since')||TD());if(since>TD())since=TD();
    if(M.id){var h=findHabit(M.id);if(h){h.title=title;h.icon=icon||h.icon;if(h.kind==='quit'&&fd.get('since'))h.since=since}}
    else{
      var nh={id:uid(),title:title,icon:icon||(kind==='quit'?'ban':'leaf'),kind:kind,created:TD(),done:{},relapses:[]};
      if(kind==='quit'){nh.since=since;nh.best=0}
      S.habits.push(nh);
    }
  }
  closeModal();save();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&M)closeModal()});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(['today','planner','goals','habits','reports'].indexOf(h)>-1&&h!==tab){tab=h;render()}});

/* ---------- init ---------- */
(function(){var h=location.hash.slice(1);if(['today','planner','goals','habits','reports'].indexOf(h)>-1)tab=h})();
var local=normalize(loadLocal());
S=local||seedState((navigator.language||'uk').toLowerCase().indexOf('en')===0?'en':'uk');
function initFirebase(cfg){
  var V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
  function load(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
  function ready(){return window.firebase&&firebase.auth&&firebase.firestore}
  var p=ready()?Promise.resolve():load(B+'firebase-app-compat.js').then(function(){return load(B+'firebase-auth-compat.js')}).then(function(){return load(B+'firebase-firestore-compat.js')});
  setSync('slow');
  p.then(function(){
    firebase.initializeApp(cfg);
    var auth=firebase.auth(),db=firebase.firestore();
    FB={auth:auth,provider:new firebase.auth.GoogleAuthProvider(),user:null};
    auth.onAuthStateChanged(function(u){
      if(unsub){unsub();unsub=null}
      ref=null;FB.user=u||null;
      if(!u){setSync('signin');render();return}
      ref=db.doc('users/'+u.uid+'/data/tracker');
      var key='fb-linked-'+u.uid,linked=false;
      try{linked=!!localStorage.getItem(key)}catch(e){}
      function mark(){try{localStorage.setItem(key,'1')}catch(e){}linked=true}
      setSync('slow');render();
      var slow=setTimeout(function(){if(sync!=='saved')setSync('slow')},10000);
      unsub=ref.onSnapshot(function(snap){
        if(snap.metadata&&snap.metadata.hasPendingWrites)return;
        var data=snap.exists?snap.data():null;
        if(snap.metadata&&snap.metadata.fromCache&&!data)return;
        clearTimeout(slow);
        if(data&&data.v){
          if(!linked||(data.updated||0)>(S.updated||0)){
            S=normalize(data);mark();migrate();saveLocal();applyTheme();render();
            if(pending){pending=false;dirty=true;setSync('saving');flush()}else setSync('saved');
          }else if((S.updated||0)>(data.updated||0)){dirty=true;setSync('saving');flush()}
          else setSync('saved');
        }else{
          mark();migrate();pending=false;S.updated=S.updated||Date.now();saveLocal();dirty=true;setSync('saving');flush();
        }
      },function(){clearTimeout(slow);setSync('error')});
    });
  }).catch(function(){setSync('error')});
}
var pending=false;
function migrate(){
  var ch=false;S.mig=S.mig||{};
  if(!S.mig.plan1){S.mig.plan1=1;S.goals=S.goals.concat(planGoals(S.lang));ch=true}
  if(!S.mig.plan2){S.mig.plan2=1;S.plan=(S.plan||[]).concat(planItems(S.lang));ch=true}
  if(ch){S.updated=Date.now();saveLocal();pending=true}
  return ch;
}
if(local)migrate();
applyTheme();render();
(function(){
  var fc=window.FIREBASE_CONFIG;
  if(fc&&fc.apiKey&&String(fc.apiKey).indexOf('PASTE')<0){initFirebase(fc);return}
  var c=window.claude;
  if(!c||!c.use){setSync('local');return}
  Promise.all([c.use('user'),c.use('db')]).then(function(r){
    var user=r[0],dbns=r[1];
    if(!user||!dbns){setSync('local');return}
    return user.id().then(function(id){
      if(!id){setSync('local');return}
      ref=dbns.doc('data/users/'+id+'/tracker-v3');
      var slow=setTimeout(function(){if(sync!=='saved')setSync('slow')},10000);
      ref.onSnapshot(function(snap){
        if(snap.metadata&&snap.metadata.hasPendingWrites)return;
        var data=snap.exists?snap.data():null;
        if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(slow)}
        if(data&&data.v){
          if((data.updated||0)>(S.updated||0)){S=normalize(data);migrate();saveLocal();applyTheme();render()}
          if(pending){pending=false;dirty=true;setSync('saving');flush()}
          if(!snap.metadata||!snap.metadata.fromCache)setSync('saved');
        }else if(!snap.metadata||!snap.metadata.fromCache){
          if(S.updated){dirty=true;setSync('saving');flush()}else setSync('saved');
        }
      },function(){setSync('error')});
    });
  }).catch(function(){setSync('local')});
})();
})();
</script>
